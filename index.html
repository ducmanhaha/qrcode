<!DOCTYPE html>
<html lang="en">
  <title>QR code</title>
  <link href='https://fonts.googleapis.com/css?family=Outfit' rel='stylesheet'>
<style>
  body {
    background-color: hsl(212, 45%, 89%);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .block1{
    width: 320px;
    height: 499px;
    background-color: hsl(0, 0%, 100%);
    border-radius: 20px;
    padding: 16px;
    box-sizing: border-box;
    text-align: center;
  }
  .content{
    font-size: 9px;
    font-family: 'Outfit';
    padding-top: 24px;
    padding-right: 16px;
    padding-bottom: 16px;
    padding-left: 40px;
    text-align: center;
  }
  img {
    max-width: 100%;
    height: auto;
    border-radius: 10px;
  }
  .content1{
    font-size: 14px;
    color: hsl(216, 15%, 48%);
  }
</style>
<main>
  <body>
    <div class="block1">
      <!-- <div class="block2"><br>
      </div> -->
      <img src="/images/image-qr-code.png" alt="QR code">
      <div class="content">
        <h1>Improve your front-end skills by building projects</h1>
        <p class="content1">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
      </div>
    </div>
    </body>
</main>
</html>
